<title>منصة حِصّة</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: design 2 — dark-teal side rail on the right, mint active state, white cards on a cool grey-green ground; public pages share the same palette. */
:root{
  --bg:#eef4f3; --card:#ffffff; --ink:#0f2f2b; --muted:#5d7472; --line:#e1ebe9; --soft:#f5f9f8;
  --rail:#0f4c45; --rail-2:#155e55; --rail-ink:#d8f3ee; --mint:#5ee6d0; --mint-ink:#0b3d37;
  --teal:#14b8a6; --teal-deep:#0f766e; --orange:#f59e0b; --orange-deep:#c2700a;
  --ok-bg:#d9f6ec; --ok-fg:#0d7a58; --warn-bg:#fdf0d2; --warn-fg:#a65c06; --info-bg:#e4eef2; --info-fg:#1f5b70; --bad-bg:#fde4e1; --bad-fg:#b42318;
  --track:#e3ecea; --shadow:0 1px 2px rgba(15,47,43,.04),0 8px 24px rgba(15,47,43,.05); --wa-bg:#d9fdd3; --wa-ground:#efeae2; --paper:#fbfaf6;
  --f-display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",Tahoma,sans-serif;
  --r:20px; --r-sm:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1615; --card:#11201e; --ink:#e4f2ef; --muted:#93aba7; --line:#1d3330; --soft:#152826;
  --rail:#082b27; --rail-2:#0f3d37; --rail-ink:#cfeee8; --mint:#4fd9c3; --mint-ink:#062824;
  --teal:#2cc9b6; --teal-deep:#5fd6c6; --orange:#f5a623; --orange-deep:#f6b54a;
  --ok-bg:#123a2f; --ok-fg:#6fe0b6; --warn-bg:#3a2a0e; --warn-fg:#f6c165; --info-bg:#14303a; --info-fg:#8cc8dc; --bad-bg:#3d1714; --bad-fg:#ff9b8f;
  --track:#1f3532; --shadow:0 1px 2px rgba(0,0,0,.3); --wa-bg:#144d37; --wa-ground:#0e1a18; --paper:#1a2b29; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1615; --card:#11201e; --ink:#e4f2ef; --muted:#93aba7; --line:#1d3330; --soft:#152826;
  --rail:#082b27; --rail-2:#0f3d37; --rail-ink:#cfeee8; --mint:#4fd9c3; --mint-ink:#062824;
  --teal:#2cc9b6; --teal-deep:#5fd6c6; --orange:#f5a623; --orange-deep:#f6b54a;
  --ok-bg:#123a2f; --ok-fg:#6fe0b6; --warn-bg:#3a2a0e; --warn-fg:#f6c165; --info-bg:#14303a; --info-fg:#8cc8dc; --bad-bg:#3d1714; --bad-fg:#ff9b8f;
  --track:#1f3532; --shadow:0 1px 2px rgba(0,0,0,.3); --wa-bg:#144d37; --wa-ground:#0e1a18; --paper:#1a2b29; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;direction:rtl}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.3}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px;border-radius:8px}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:16px;height:16px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}

/* demo bar */
.demo{background:var(--rail);color:var(--rail-ink);font-size:13px}
.demo .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-block:8px}
.demo .tag{opacity:.8}
.seg{display:flex;gap:4px;background:rgba(255,255,255,.08);padding:4px;border-radius:999px}
.seg button{border:0;background:none;color:var(--rail-ink);padding:5px 14px;border-radius:999px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--mint);color:var(--mint-ink);font-weight:600}

/* buttons, pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:var(--r-sm);padding:11px 20px;font-weight:600;font-family:var(--f-display);font-size:15px;text-decoration:none;transition:transform .15s,background .15s}
.btn:active{transform:scale(.98)}
.btn-pri{background:var(--teal-deep);color:#fff}
:root[data-theme="dark"] .btn-pri{color:#06221f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-pri{color:#06221f}}
.btn-pri:hover{background:var(--teal)}
.btn-mint{background:var(--mint);color:var(--mint-ink)}
.btn-ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:var(--teal)}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:10px}
.link{background:none;border:0;color:var(--teal-deep);font-weight:600;font-family:var(--f-display);padding:0;font-size:14px;display:inline-flex;gap:4px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 12px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;font-family:var(--f-display)}
.p-ok{background:var(--ok-bg);color:var(--ok-fg)}
.p-warn{background:var(--warn-bg);color:var(--warn-fg)}
.p-info{background:var(--info-bg);color:var(--info-fg)}
.p-bad{background:var(--bad-bg);color:var(--bad-fg)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.av{display:grid;place-items:center;border-radius:14px;color:#fff;font-family:var(--f-display);font-weight:700;flex:none}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--teal)}
.bar.o>i{background:var(--orange)}
.stars{color:var(--orange);display:inline-flex;align-items:center;gap:4px;font-weight:600;font-family:var(--f-display)}
.stars svg{fill:var(--orange);stroke:none}

/* ===== public site ===== */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:24px;padding-block:14px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--ink);background:none;border:0;padding:0}
.logo .mk{width:40px;height:40px;border-radius:12px;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center;font-size:22px}
.nav-links{display:flex;gap:22px;margin-inline-start:12px}
.nav-links button{background:none;border:0;color:var(--muted);font-weight:500;padding:4px 0}
.nav-links button:hover,.nav-links button.on{color:var(--ink)}
.nav .sp{flex:1}
.hero{padding-block:56px 40px}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;background:var(--ok-bg);color:var(--ok-fg);padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600}
.hero h1{font-size:clamp(34px,5vw,54px);font-weight:700;margin-block:18px 16px;letter-spacing:-.5px}
.hero h1 em{font-style:normal;color:var(--teal-deep)}
.hero .lead{font-size:18px;color:var(--muted);max-width:34em}
.hero .ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.hero .facts{display:flex;gap:28px;margin-top:32px;flex-wrap:wrap}
.hero .facts b{display:block;font-family:var(--f-display);font-size:24px}
.hero .facts span{color:var(--muted);font-size:13px}
.hv{position:relative;display:grid;gap:14px}
.hv .next{transform:rotate(-1.5deg)}
.hv .mini{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.next{background:linear-gradient(115deg,#0f5a51 0%,#11806f 55%,#16b5a2 100%);color:#fff;border-radius:var(--r);padding:24px 26px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.next .k{opacity:.85;font-size:14px}
.next h3{font-size:22px;margin-block:6px;color:#fff}
.next .btn{background:#fff;color:#0f4c45}
.stat{padding:20px 22px}
.stat .lbl{color:var(--muted);font-size:14px}
.stat .v{font-size:30px;font-weight:700;margin-block:6px 10px;font-family:var(--f-display);font-variant-numeric:tabular-nums}
.stat .v small{font-size:16px;color:var(--muted);font-weight:500}
.stat .sub{color:var(--muted);font-size:13px}
.pay{border-block:1px solid var(--line);background:var(--card)}
.pay .wrap{display:flex;align-items:center;gap:12px 28px;flex-wrap:wrap;padding-block:18px;justify-content:center;color:var(--muted);font-size:14px}
.pay b{color:var(--ink);font-family:var(--f-display);font-weight:600}
.sec{padding-block:64px}
.sec-h{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(24px,3vw,32px)}
.sec-h p{color:var(--muted);margin-top:6px}
.subs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.subj{display:flex;align-items:center;gap:14px;padding:18px;border:1px solid var(--line);background:var(--card);border-radius:16px;text-align:start;transition:border-color .15s,transform .15s}
.subj:hover{border-color:var(--teal);transform:translateY(-2px)}
.subj .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.subj b{display:block;font-family:var(--f-display);font-weight:600}
.subj span{font-size:13px;color:var(--muted)}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
.tc{display:flex;flex-direction:column;gap:14px;padding:22px;text-align:start;border:1px solid transparent;transition:border-color .15s,transform .15s;cursor:pointer}
.tc:hover{border-color:var(--teal);transform:translateY(-2px)}
.tc .top{display:flex;gap:14px;align-items:center}
.tc h3{font-size:17px}
.tc .meta{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.tc .hl{font-size:14px;color:var(--muted);min-height:3.2em}
.tc .foot{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px;margin-top:auto}
.tc .price{font-family:var(--f-display);font-weight:700;font-size:18px}
.tc .price small{font-weight:500;color:var(--muted);font-size:13px}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;counter-reset:s}
.step{padding:28px;position:relative}
.step .n{width:40px;height:40px;border-radius:12px;background:var(--mint);color:var(--mint-ink);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;margin-bottom:16px}
.step h3{font-size:19px;margin-bottom:8px}
.step p{color:var(--muted)}
.forT{background:var(--rail);color:var(--rail-ink);border-radius:28px;padding:48px;display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center}
.forT h2{color:#fff;font-size:clamp(26px,3.2vw,36px);margin-bottom:14px}
.forT ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px}
.forT li{display:flex;gap:10px;align-items:flex-start}
.forT li svg{color:var(--mint);margin-top:3px}
.plan{background:var(--rail-2);border-radius:20px;padding:30px}
.plan .big{font-family:var(--f-display);font-size:44px;font-weight:700;color:#fff;line-height:1}
.plan .row{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.12);padding-block:12px;font-size:14px}
.quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.q{padding:26px;display:flex;flex-direction:column;gap:16px}
.q p{font-size:15.5px}
.q .who{display:flex;gap:12px;align-items:center;margin-top:auto}
.q .who b{display:block;font-family:var(--f-display);font-weight:600;font-size:14px}
.q .who span{font-size:13px;color:var(--muted)}
footer.site{border-top:1px solid var(--line);margin-top:24px}
footer.site .wrap{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;padding-block:32px;color:var(--muted);font-size:14px}
footer.site .cols{display:flex;gap:48px;flex-wrap:wrap}
footer.site h4{color:var(--ink);font-size:14px;margin-bottom:8px}
footer.site .cols div{display:grid;gap:4px}

/* browse */
.browse{display:grid;grid-template-columns:260px 1fr;gap:24px;padding-block:32px 64px}
.filters{padding:22px;align-self:start;position:sticky;top:90px;display:grid;gap:20px}
.filters label.h{font-family:var(--f-display);font-weight:600;font-size:14px;display:block;margin-bottom:8px}
.field{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:10px 14px;outline:0}
.field:focus{border-color:var(--teal)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--teal-deep);border-color:var(--teal-deep);color:#fff}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);color:var(--muted)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0;color:var(--ink)}
.rhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-block:18px;flex-wrap:wrap}

/* profile */
.cover{background:linear-gradient(120deg,#0f4c45,#11806f 60%,#16b5a2);height:180px;border-radius:0 0 28px 28px}
.prof{display:grid;grid-template-columns:1fr 340px;gap:24px;margin-top:-80px;padding-bottom:64px}
.prof-main{display:grid;gap:20px;min-width:0}
.ph{padding:28px;display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.ph h1{font-size:28px}
.ph .tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.kv{display:flex;gap:28px;flex-wrap:wrap;margin-top:18px}
.kv b{display:block;font-family:var(--f-display);font-size:20px}
.kv span{font-size:13px;color:var(--muted)}
.box{padding:24px}
.box h2{font-size:20px;margin-bottom:14px}
.unit{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.unit+.unit{margin-top:12px}
.unit>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:var(--soft);font-family:var(--f-display);font-weight:600}
.unit>summary::-webkit-details-marker{display:none}
.lesson{display:flex;align-items:center;gap:14px;padding:14px 18px;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;text-align:start}
.lesson:hover{background:var(--soft)}
.lesson .t{flex:1;min-width:0}
.lesson .t b{display:block;font-weight:600;font-size:15px}
.lesson .t span{font-size:13px;color:var(--muted)}
.ltype{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.lt-video{background:var(--info-bg);color:var(--info-fg)}
.lt-pdf{background:var(--warn-bg);color:var(--warn-fg)}
.lt-quiz{background:var(--ok-bg);color:var(--ok-fg)}
.lt-live{background:var(--bad-bg);color:var(--bad-fg)}
.side{display:grid;gap:20px;align-self:start;position:sticky;top:90px}
.buy{padding:24px;display:grid;gap:14px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;cursor:pointer}
.opt:has(input:checked){border-color:var(--teal);background:color-mix(in srgb,var(--teal) 8%,var(--card))}
.opt input{accent-color:var(--teal-deep);margin:0}
.opt .t{flex:1}
.opt .t b{display:block;font-family:var(--f-display);font-weight:600}
.opt .t span{font-size:13px;color:var(--muted)}
.opt .pr{font-family:var(--f-display);font-weight:700}
.rev{padding-block:16px;border-top:1px solid var(--line)}
.rev:first-of-type{border-top:0;padding-top:0}
.rev .h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.ul li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.ul li svg{color:var(--teal-deep);margin-top:2px}

/* ===== dashboard (design 2) ===== */
.dash{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh;background:linear-gradient(to left,var(--rail) 270px,transparent 270px)}
.rail{background:var(--rail);color:var(--rail-ink);padding:28px 18px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh;overflow:auto}
.rail .logo{color:#fff;margin:0 10px 20px}
.rail nav{display:grid;gap:6px}
.rail nav button{display:flex;align-items:center;gap:12px;border:0;background:none;color:var(--rail-ink);padding:10px 16px;border-radius:14px;font-family:var(--f-display);font-size:15.5px;text-align:start}
.rail nav button:hover{background:rgba(255,255,255,.06)}
.rail nav button.on{background:var(--mint);color:var(--mint-ink);font-weight:600}
.rail .note{margin-top:auto;background:var(--rail-2);border-radius:18px;padding:20px}
.rail .note b{display:block;font-family:var(--f-display);color:#fff;margin-bottom:6px}
.rail .note p{font-size:13.5px;opacity:.85;margin-bottom:12px}
.main{padding:32px 40px 48px;display:grid;gap:24px;align-content:start;min-width:0}
.top{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
.top .hi{flex:1;min-width:220px}
.top h1{font-size:30px;font-weight:700}
.top .hi p{color:var(--muted);margin-top:4px}
.top .search{width:min(420px,100%)}
.me{display:flex;align-items:center;gap:12px;font-family:var(--f-display);font-weight:600}
.bell{position:relative;background:none;border:0;color:var(--orange);padding:6px}
.bell i{position:absolute;top:4px;left:4px;width:8px;height:8px;border-radius:50%;background:var(--bad-fg)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.g2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px;align-items:start}
.col{display:grid;gap:24px;min-width:0}
.panel{padding:26px}
.ph2{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph2 h2{font-size:20px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl td,.tbl th{padding:14px 8px;border-bottom:1px solid var(--line);text-align:start;vertical-align:middle}
.tbl th{font-weight:500;color:var(--muted);font-size:13px}
.tbl tr:last-child td{border-bottom:0}
.tbl .ttl{display:flex;align-items:center;gap:10px;font-weight:600;font-family:var(--f-display)}
.tbl tr.clk{cursor:pointer}
.tbl tr.clk:hover td{background:var(--soft)}
.scroll{overflow-x:auto}
.trow{display:flex;align-items:center;gap:14px;padding-block:16px;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .t{flex:1;min-width:0}
.trow .t b{display:block;font-family:var(--f-display);font-weight:600}
.trow .t span{font-size:13px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .dn{color:var(--muted);font-size:13px;padding-bottom:6px}
.cal .d{padding:9px 0;border-radius:10px;font-family:var(--f-display);font-size:14px;font-variant-numeric:tabular-nums}
.cal .d.ev{background:var(--warn-bg);color:var(--warn-fg);font-weight:600}
.cal .d.today{background:var(--teal);color:#fff;font-weight:700}
.cal .d.out{opacity:.3}
.legend{display:flex;gap:16px;margin-top:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.chart{display:flex;align-items:flex-end;gap:14px;height:220px;padding-top:24px;background:repeating-linear-gradient(to top,var(--line) 0 1px,transparent 1px 55px)}
.chart .c{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}

function renderGrid(){
 const f=state.filt,q=f.q.trim();
 let list=TEACHERS.filter(t=>(!f.subject||t.subject===f.subject)&&(!f.grade||t.grade===f.grade)&&(!f.city||t.city===f.city)&&(!q||(t.name+t.subject+t.headline).includes(q)));
 list.sort((a,b)=>f.sort==='price'?a.price-b.price:f.sort==='students'?b.students-a.students:b.rating-a.rating);
 const g=document.getElementById('grid');if(!g)return;
 g.innerHTML=list.length?list.map(teacherCard).join(''):`<div class="card empty" style="grid-column:1/-1">ما في أساتذة بهالتصفية حاليًا. جرّب مادة أو مدينة ثانية.</div>`;
 document.getElementById('f-count').textContent=`${list.length} أستاذ`;
 const s=document.getElementById('f-sort');if(s)s.value=f.sort;
}

  case 'golive':toast('انضافت الحصة للجدول، وانبعث تذكير واتساب للطلاب المسجّلين.');break;
  case 'offline':toast('انحفظت المادة للمشاهدة بدون نت داخل التطبيق (مشفّرة، ما بتفتح برا حِصّة).');break;
  case 'play':{const p=el.closest('.player');el.remove();const b=p.querySelector('.pb .bar i');let w=0;const iv=setInterval(()=>{w+=1;b.style.width=w+'%';if(w>=100||!document.body.contains(b))clearInterval(iv)},120);break}
  case 'nudge':toast(`انبعث تذكير واتساب لـ ${el.dataset.n} ولولي أمره.`);break;
  case 'approve':{const r=state.requests.splice(i,1)[0];document.getElementById('reqs').innerHTML=reqList();document.getElementById('req-count').textContent=state.requests.length;toast(`تأكد اشتراك ${r.n}، وانضافت ${r.a} د.أ لأرباحك.`);break}
  case 'mark-done':{if(!state.done.has(el.dataset.k)){state.done.add(el.dataset.k);state.points+=20}closeModal();rerender();toast('أحسنت! +20 نقطة وانحسبت بتقدّمك.');break}
  case 'install':installModal();break;
  case 'hide-install':state.installHidden=true;rerender();break;
  case 'cert':certModal();break;
  case 'cert-send':toast('انبعتت الشهادة لولي الأمر على الواتساب.');break;
  case 'cert-share':toast('انسخ رابط الشهادة: hessa.jo/cert/HS-C-20419');break;
  case 'ref':(navigator.clipboard?navigator.clipboard.writeText('MOHD-7Q2'):Promise.reject()).then(()=>toast('انسخ كودك MOHD-7Q2. ابعته لصاحبك.'),()=>toast('كودك: MOHD-7Q2. ابعته لصاحبك.'));break;
  case 'ref-teacher':toast('انبعتت دعوة واتساب. أول ما يفتح صفحته، بتاخذ شهر بدون عمولة.');break;
  case 'hw-up':hwUpModal(el.dataset.i);break;
  case 'hw-view':hwViewModal(el.dataset.i);break;
  case 'grade':gradeModal(i);break;
  case 'group':groupModal(i);break;
  case 'join':{const g=state.groups[i];g.joined=true;g.m++;rerender();toast(`انضميت لمجموعة «${g.n}».`);break}
  case 'new-group':newGroupModal();break;
  case 'rm-device':{const d=state.devices.splice(i,1)[0];rerender();toast(`طلعنا الحساب من ${d[0].split(' · ')[0]}.`);break}
  case 'my-data':toast('بنجهّز نسخة من بياناتك، وبتوصلك على الواتساب خلال 24 ساعة.');break;
  case 'del-acc':toast('وصل طلب حذف الحساب. رح نتواصل معك ومع ولي أمرك للتأكيد.');break;
  case 'tq-voice':{const on=el.classList.toggle('btn-pri');el.classList.toggle('btn-ghost',!on);toast(on?'بتسجّل رد صوتي... اكبس مرة ثانية لتوقف.':'انحفظ الرد الصوتي (0:32).');break}
  case 'tq-img':toast('اختار صورة الحل من جهازك.');break;
  case 'tq-send':{const inp=document.getElementById('tq-'+i);const txt=inp.value.trim()||'رد صوتي · 0:32';const q=state.tq.splice(i,1)[0];(state.qa[q.k]=state.qa[q.k]||[]).push({n:q.n,w:q.w,q:q.q,a:{by:'أ. خالد',t:inp.value.trim()?'text':'voice',txt,w:'الآن'}});rerender();toast(`انبعث ردّك لـ ${q.n}، وبيظهر تحت الدرس لكل الطلاب.`);break}
  case 'new-coupon':couponModal();break;
  case 'add-member':memberModal();break;
  case 'center':toast('وصل طلبك. فريق حِصّة رح يتواصل معك لتجهيز حساب المركز.');break;
  case 'more':moreModal();break;
  case 'v-ok':{const v=state.verify.splice(i,1)[0];rerender();toast(`توثّقت صفحة أ. ${v.n} ونزلت للعامة.`);break}
  case 'v-ask':{const v=state.verify[i];toast(`انبعتت رسالة لـ ${v.n} يرفع شهادة المؤهل.`);break}
  case 'v-no':{const v=state.verify.splice(i,1)[0];rerender();toast(`انرفض طلب ${v.n} وانبعتله السبب.`);break}
  case 'r-ok':{const r=state.refunds.splice(i,1)[0];rerender();toast(`اعتمدنا استرجاع ${r.a} د.أ لـ ${r.n}.`);break}
  case 'r-no':{const r=state.refunds.splice(i,1)[0];rerender();toast(`انرفض الطلب وانبعت شرح لـ ${r.n}.`);break}
  case 'pay-run':state.payRun=true;rerender();toast('اعتمدنا دفعة التحويلات: 24,608 د.أ لـ 5 أساتذة.');break;
  case 'rep-close':{state.reports.splice(i,1);rerender();toast(el.dataset.m);break}
 }
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&mroot.innerHTML)closeModal();
 if(e.key==='Enter'&&e.target.matches('[data-teacher][tabindex]'))e.target.click();
 if(e.key==='Enter'&&e.target.id==='d-search'){const v=e.target.value.trim();state.filt={q:v,subject:'',grade:'',city:'',sort:'rating'};go('browse')}
 if(e.key==='Backspace'&&e.target.classList.contains('otp-in')&&!e.target.value){const p=e.target.previousElementSibling;p&&p.focus()}
});
document.addEventListener('input',e=>{
 const t=e.target,id=t.id;
 if(id==='f-q'){state.filt.q=t.value;renderGrid()}
 if(id==='stu-q')document.getElementById('stu-body').innerHTML=stuRows(t.value.trim());
 if(t.classList.contains('otp-in')){t.value=t.value.replace(/\D/g,'').slice(-1);if(t.value&&t.nextElementSibling)t.nextElementSibling.focus()}
 if(/^pr-[mty]$/.test(id)){const v=+t.value||0;document.getElementById('net-'+id.slice(3)).textContent=(v*0.9).toFixed(1).replace('.0','')}
});
document.addEventListener('paste',e=>{if(e.target.classList&&e.target.classList.contains('otp-in')){const d=(e.clipboardData.getData('text')||'').replace(/\D/g,'').slice(0,6);if(d.length){e.preventDefault();document.querySelectorAll('.otp-in').forEach((x,j)=>x.value=d[j]||'')}}});
document.addEventListener('change',e=>{
 const t=e.target,id=t.id;
 if(id==='f-subject'){state.filt.subject=t.value;renderGrid()}
 if(id==='f-city'){state.filt.city=t.value;renderGrid()}
 if(id==='f-sort'){state.filt.sort=t.value;renderGrid()}
 if(t.name==='plan'||t.name==='pm')updatePayBtn();
 if(t.name==='age'){document.getElementById('par-wrap').hidden=t.value==='o'}
 if(id==='up-file'&&t.files[0])document.getElementById('up-fname').textContent=t.files[0].name;
 if(id==='hw-file'&&t.files[0]){document.getElementById('hw-fname').textContent=`${t.files.length} صورة جاهزة`;const r=new FileReader();r.onload=()=>{document.getElementById('hw-prev').innerHTML=`<img src="${r.result}" alt="صورة الحل" style="border-radius:12px;max-height:240px;object-fit:contain;width:100%">`};r.readAsDataURL(t.files[0])}
 if(t.dataset.set){state.settings[t.dataset.set]=t.checked;toast(t.checked?'تفعّل.':'توقّف.')}
});
document.addEventListener('submit',e=>{
 e.preventDefault();const f=e.target;
 if(f.id==='login-1'){state.login.phone=f.querySelector('#ph').value.trim();loginModal(2)}
 if(f.id==='login-2'){const c=[...f.querySelectorAll('.otp-in')].map(x=>x.value).join('');if(c!=='482913'){toast('الكود غلط. جرّب 482913 بنسخة العرض.');return}loginModal(3)}
 if(f.id==='login-3'){if(f.querySelector('input[name=age]:checked').value==='u')loginModal(4);else{state.loggedIn=true;closeModal();go('student',{stab:'home'});toast('أهلا فيك! حسابك جاهز.')}}
 if(f.id==='sub-form'){const id=f.dataset.id,pm=f.pm.value,plan=f.plan.value;if(pm==='code'){if(!document.getElementById('act-code').value.trim()){document.getElementById('act-code').focus();return}activate(id,plan,'code',0,'CODE');return}payStep(id,plan,pm,payTotal(f))}
 if(f.id==='quiz-form'){const {s}=grade(f,QUIZ);const score=Math.round(s/3*100);state.quizScore=score;state.done.add('khaled:0:4');state.points+=50;
  document.getElementById('quiz-res').innerHTML=`<div class="paper" style="text-align:center"><b class="num" style="font-size:28px">${s}/3</b><span class="muted">${s===3?'علامة كاملة! +50 نقطة. كمّل على درس قاعدة السلسلة.':'+50 نقطة على المحاولة. راجع درس قواعد الاشتقاق وجرّب مرة ثانية.'}</span></div>`;
  f.querySelector('button[type=submit]').outerHTML=`<button class="btn btn-ghost" type="button" data-act="close">تم</button>`;if(state.route==='student')rerender()}
 if(f.id==='mock-form'){clearInterval(mockTimer);const {s,per}=grade(f,MOCK);const topics=Object.entries(per).map(([k,v])=>[k,Math.round(v[0]/v[1]*100)]);state.mock={topics};state.points+=80;const w=topics.slice().sort((a,b)=>a[1]-b[1])[0];
  document.getElementById('mock-res').innerHTML=`<div class="paper" style="text-align:center"><b class="num" style="font-size:28px">${s}/5</b><span class="muted">أضعف وحدة: <b style="color:var(--ink)">${w[0]}</b> (${w[1]}%). شوف تحليل نقاط ضعفك ببنك الأسئلة. +80 نقطة.</span></div>`;
  f.querySelector('button[type=submit]').outerHTML=`<button class="btn btn-ghost" type="button" data-stab="bank">شوف التحليل</button>`;if(state.route==='student'&&state.stab==='bank')rerender()}
 if(f.id==='up-form'){const k=T('khaled');const ui=+document.getElementById('up-unit').value;const type=document.getElementById('up-type').value;const title=document.getElementById('up-title').value.trim();
  const it=[title,type,type==='video'?'جاري التشفير والمعالجة':type==='pdf'?'ملف جديد':'أسئلة جديدة',document.getElementById('up-free').checked?1:0];it.isNew=true;k.units[ui].items.push(it);
  const n=document.getElementById('up-notify').checked;closeModal();state.ttab='content';if(state.route==='tdash')rerender();toast(`انشرت «${title}»${n?' وانبعث إشعار واتساب لـ 312 طالب':''}.`)}
 if(f.id==='ask-form'){const k=f.dataset.k,q=document.getElementById('ask-in').value.trim();(state.qa[k]=state.qa[k]||[]).push({n:'إنت',w:'الآن',q});const em=f.parentElement.querySelector('p.muted');em&&em.remove();f.insertAdjacentHTML('beforebegin',`<div class="qi"><div class="h"><b>إنت</b><span>الآن</span></div><p>${q.replace(/</g,'&lt;')}</p><span class="pill p-warn" style="margin-top:8px">بانتظار رد الأستاذ</span></div>`);f.reset();toast('وصل سؤالك للأستاذ، وبيوصلك إشعار لما يرد.')}
 if(f.id==='hw-form'){const h=state.hw.find(x=>x.id==f.dataset.i);h.st='sent';h.due='تم التسليم اليوم';closeModal();rerender();toast('تسلّم الواجب. بيوصلك إشعار لما الأستاذ يصحّح.')}
 if(f.id==='grade-form'){const h=state.thw[+f.dataset.i];h.st='done';h.score=document.getElementById('gr-s').value+'/10';closeModal();rerender();toast(`انبعث التصحيح لـ ${h.n} ولولي أمره.`)}
 if(f.id==='g-form'){const v=document.getElementById('g-in').value.trim();document.getElementById('g-msgs').insertAdjacentHTML('beforeend',`<div class="qi"><div class="h"><b>إنت</b><span>الآن</span></div><p>${v.replace(/</g,'&lt;')}</p></div>`);f.reset()}
 if(f.id==='ng-form'){const n=document.getElementById('ng-n').value.trim();state.groups.unshift({n,tid:document.getElementById('ng-t').value,m:1,max:8,last:'إنت: أهلا فيكم!',joined:true});closeModal();rerender();toast(`انعملت مجموعة «${n}». ادعُ زملاءك.`)}
 if(f.id==='cp-form'){const c=document.getElementById('cp-c').value.trim().toUpperCase();state.coupons.unshift([c,'خصم '+document.getElementById('cp-p').value,document.getElementById('cp-b').value,0,'فعّال']);COUPONS[c]=parseInt(document.getElementById('cp-p').value)/100;closeModal();rerender();toast(`انعمل الكوبون ${c}. شاركه مع طلابك.`)}
 if(f.id==='mem-form'){const n=document.getElementById('mem-n').value.trim();const perms=[['mp1','الرد على الأسئلة'],['mp2','تصحيح الواجبات'],['mp3','رفع المواد']].filter(p=>document.getElementById(p[0]).checked).map(p=>p[1]).join(' · ');state.team.push([n,'مساعد',perms||'بدون صلاحيات','#0e7490']);closeModal();rerender();toast(`انبعتت دعوة واتساب لـ ${n}.`)}
 if(f.id==='price-form'){['m','t','y'].forEach(k=>state.prices[k]=+document.getElementById('pr-'+k).value);state.prices.trial=document.getElementById('pr-trial').checked;T('khaled').price=state.prices.m;T('khaled').term=state.prices.t;toast('انحفظت الأسعار، وبتطبق على الاشتراكات الجديدة.')}
 if(f.id==='rep-form'){closeModal();toast('وصل البلاغ لفريق حِصّة، ورح نراجعه خلال 24 ساعة.')}
 if(f.id==='ref-form'){const p=state.payments[+f.dataset.i];state.refunded.add(p.no);closeModal();rerender();toast(`وصل طلب الاسترجاع. ${p.a} د.أ بترجع لـ ${p.m} خلال 3 أيام عمل.`)}
});

render();
</script>
